<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дашборд отзывов — Мадлен</title>
<style>

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --primary: #0f2a4a;
    --primary-light: #1a3c66;
    --gold: #c9a227;
    --gold-light: #e8b74a;
    --green: #2e9e5b;
    --red: #d9534f;
    --yellow: #e6a817;
    --blue: #3d8fbf;
    --text: #1a2233;
    --text-dim: #5a6a80;
    --text-mute: #8a96a8;
  }

  body {
    font-family: 'Segoe UI', Calibri, system-ui, sans-serif;
    background: #f5f5f5;
    padding: 15px;
    font-size: 12px;
    color: var(--text);
    min-height: 100vh;
  }

  .container { max-width: 1500px; margin: 0 auto; }
  h1 { font-size: 20px; color: var(--primary); margin-bottom: 12px; font-weight: 700; letter-spacing: .3px; }

  /* ── TABS ── */
  .tabs {
    display: flex; gap: 8px; margin-bottom: 16px;
    padding: 5px;
    background: rgba(15,42,74,0.04);
    border: 1px solid rgba(15,42,74,0.08);
    border-radius: 100px;
    width: fit-content;
    flex-wrap: wrap;
    box-shadow: 0 2px 10px rgba(15,42,74,0.06);
  }
  .tab {
    padding: 10px 24px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 100px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    font-size: 13px;
    color: var(--text-dim);
    user-select: none;
    transition: all .3s cubic-bezier(.4,0,.2,1);
  }
  .tab:hover { color: var(--primary); background: rgba(15,42,74,0.05); }
  .tab.active {
    color: #fff;
    background: linear-gradient(135deg, #0f2a4a, #1a3c66);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.2),
      0 4px 14px rgba(15,42,74,0.3);
    transform: translateY(-1px);
  }

  .panel { display: none; }
  .panel.active { display: block; animation: fadeIn .3s ease; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }

  /* ── STAT CARDS ── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
    gap: 12px; margin-bottom: 16px;
  }
  .stat-card {
    background: #fff; border-radius: 16px; padding: 16px 18px;
    box-shadow: 0 2px 10px rgba(15,42,74,.06);
    border-left: 4px solid var(--primary);
    cursor: pointer;
    transition: all .3s cubic-bezier(.4,0,.2,1);
    position: relative;
    overflow: hidden;
  }
  .stat-card::after {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle at 30% 20%, rgba(15,42,74,0.05) 0%, transparent 45%);
    opacity: 0;
    transition: opacity .4s;
    pointer-events: none;
  }
  .stat-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(15,42,74,.13); }
  .stat-card:hover::after { opacity: 1; }
  .stat-card:active { transform: translateY(-1px) scale(.99); }
  .stat-card .hint {
    position: absolute; top: 10px; right: 10px;
    font-size: 10px; color: #bbb; opacity: 0; transition: .15s;
    font-weight: 600;
  }
  .stat-card:hover .hint { opacity: 1; }
  .stat-card.negative { border-left-color: var(--red); }
  .stat-card.positive { border-left-color: var(--green); }
  .stat-card.warning  { border-left-color: var(--yellow); }
  .stat-card.info     { border-left-color: var(--blue); }
  .stat-card.gold     { border-left-color: var(--gold); }
  .stat-icon {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    background: rgba(15,42,74,0.06);
    font-size: 15px;
    margin-bottom: 10px;
  }
  .stat-title {
    font-size: 10.5px; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: .6px; margin-bottom: 6px; font-weight: 700;
  }
  .stat-value { font-size: 26px; font-weight: 700; color: var(--primary); line-height: 1; }
  .stat-card.negative .stat-value { color: var(--red); }
  .stat-card.positive .stat-value { color: var(--green); }
  .stat-card.warning  .stat-value { color: var(--yellow); }
  .stat-card.info     .stat-value { color: var(--blue); }
  .stat-card.gold     .stat-value { color: var(--gold); }
  .stat-sub { font-size: 11px; color: var(--text-mute); margin-top: 5px; }

  /* ── SECTION TITLE ── */
  .section-title {
    font-size: 14px; color: var(--primary); font-weight: 700;
    margin: 22px 0 10px; padding-bottom: 7px;
    border-bottom: 2px solid var(--gold);
    display: flex; align-items: center; gap: 8px;
  }
  .section-title .badge {
    background: var(--gold); color: #fff; font-size: 10px;
    padding: 3px 10px; border-radius: 100px; font-weight: 700;
  }

  /* ── TREND CARDS ── */
  .trend-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(440px, 1fr));
    gap: 14px; margin-bottom: 16px;
  }
  .trend-card {
    background: #fff; border-radius: 16px; padding: 18px 20px;
    box-shadow: 0 2px 10px rgba(15,42,74,.06);
  }
  .trend-card h3 {
    font-size: 13px; color: var(--primary); margin-bottom: 12px;
    padding-bottom: 8px; border-bottom: 1px solid #e8ecf2;
    display: flex; align-items: center; gap: 6px; font-weight: 700;
  }
  .trend-card h3 .note {
    font-size: 11px; font-weight: 500; color: var(--text-mute);
    margin-left: auto;
  }

  .trend-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .trend-table th {
    font-size: 10.5px; color: var(--text-mute); text-transform: uppercase;
    padding: 8px 10px; text-align: left; border-bottom: 1px solid #e8ecf2;
    font-weight: 700; letter-spacing: .3px;
  }
  .trend-table td {
    padding: 10px 10px; border-bottom: 1px solid #f2f5f9;
    vertical-align: middle;
  }
  .trend-table tr:last-child td { border-bottom: none; }
  .trend-table tr:hover td { background: #f7f9fc; }
  .trend-table td.num { text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .trend-table td.loc { font-weight: 600; color: #2a3a55; }

  .delta {
    font-weight: 700; font-variant-numeric: tabular-nums;
    white-space: nowrap;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .delta.better  { color: var(--green); }
  .delta.worse   { color: var(--red); }
  .delta.neutral { color: var(--text-mute); }

  .arrow { font-size: 12px; line-height: 1; }

  .trend-badge {
    display: inline-block;
    padding: 4px 11px;
    border-radius: 100px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .2px;
    white-space: nowrap;
  }
  .trend-badge.better  { background: rgba(46,158,91,0.12);  color: var(--green); }
  .trend-badge.worse   { background: rgba(217,83,79,0.12);  color: var(--red); }
  .trend-badge.flat    { background: rgba(138,150,168,0.12); color: var(--text-mute); }

  /* ── HOTEL CARDS ── */
  .locations-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px; margin-bottom: 16px;
  }
  .loc-card {
    background: #fff; border-radius: 16px; padding: 14px 18px;
    box-shadow: 0 2px 10px rgba(15,42,74,.06);
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer;
    transition: all .3s cubic-bezier(.4,0,.2,1);
    border-left: 4px solid var(--primary);
    gap: 12px;
  }
  .loc-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(15,42,74,.13); }
  .loc-card .loc-name { font-size: 13px; color: var(--text); font-weight: 700; }
  .loc-card .loc-meta { font-size: 11px; color: var(--text-mute); margin-top: 5px; display: flex; gap: 10px; flex-wrap: wrap; }
  .loc-card .loc-meta .neg { color: var(--red); font-weight: 600; }
  .loc-card .loc-meta .pos { color: var(--green); font-weight: 600; }

  .loc-card .loc-rating-block { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .loc-card .loc-rating {
    font-size: 20px; font-weight: 800;
    color: var(--gold); line-height: 1;
    display: flex; align-items: baseline; gap: 2px;
    letter-spacing: -0.3px;
  }
  .loc-card .loc-rating .star { font-size: 14px; }
  .loc-card .loc-rating.good { color: var(--green); }
  .loc-card .loc-rating.mid  { color: var(--yellow); }
  .loc-card .loc-rating.low  { color: var(--red); }
  .loc-card .gis-rating { font-size: 10.5px; color: var(--text-mute); font-weight: 600; }
  .loc-card .gis-rating b { color: var(--text-dim); }

  /* ── BREAKDOWNS ── */
  .breakdowns {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(285px, 1fr));
    gap: 12px; margin-bottom: 16px;
  }
  .breakdown {
    background: #fff; border-radius: 16px; padding: 16px 18px;
    box-shadow: 0 2px 10px rgba(15,42,74,.06);
  }
  .breakdown h3 {
    font-size: 12.5px; color: var(--primary); margin-bottom: 10px;
    padding-bottom: 8px; border-bottom: 1px solid #e8ecf2; font-weight: 700;
  }
  .breakdown table { width: 100%; font-size: 12px; border-collapse: collapse; }
  .breakdown td {
    padding: 7px 6px; border-bottom: 1px solid #f2f5f9;
    vertical-align: middle; cursor: pointer;
  }
  .breakdown tr:last-child td { border-bottom: none; }
  .breakdown tr:hover td { background: #f0f5ff; }
  .breakdown td:last-child {
    text-align: right; font-weight: 700; color: var(--primary);
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .bar {
    display: inline-block; height: 8px; border-radius: 4px;
    margin-right: 7px; vertical-align: middle; min-width: 3px;
  }
  .bar.negative { background: var(--red); }
  .bar.positive { background: var(--green); }
  .bar.warning  { background: var(--yellow); }
  .bar.info     { background: var(--blue); }
  .bar.gold     { background: var(--gold); }

  /* ── FILTER BANNER ── */
  .filter-banner {
    display: none; padding: 11px 16px;
    background: #fdf6e3;
    border-left: 4px solid var(--gold);
    border-radius: 12px; margin-bottom: 12px;
    font-size: 13px; color: #7a5c00;
    align-items: center; gap: 10px;
    box-shadow: 0 2px 8px rgba(201,162,39,0.1);
  }
  .filter-banner.active { display: flex; }
  .filter-banner strong { color: var(--primary); }
  .filter-banner button {
    margin-left: auto; padding: 6px 14px; font-size: 12px;
    background: rgba(15,42,74,0.08);
    color: var(--primary);
    border: 1px solid rgba(15,42,74,0.15);
    border-radius: 100px; cursor: pointer;
    font-weight: 600; font-family: inherit;
    transition: .2s;
  }
  .filter-banner button:hover { background: rgba(15,42,74,0.15); transform: translateY(-1px); }

  /* ── GLASS BUTTONS ── */
  .toolbar { margin-bottom: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button.btn-main {
    padding: 11px 22px;
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    color: #fff;
    border: 1px solid rgba(201,162,39,0.5);
    border-radius: 100px;
    cursor: pointer;
    font-size: 12.5px; font-weight: 700;
    font-family: inherit;
    transition: all .3s cubic-bezier(.4,0,.2,1);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.4),
      0 4px 14px rgba(201,162,39,0.35);
    position: relative;
    overflow: hidden;
  }
  button.btn-main::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
    transition: left .5s;
  }
  button.btn-main:hover {
    transform: translateY(-2px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.5),
      0 8px 24px rgba(201,162,39,0.5);
  }
  button.btn-main:hover::before { left: 100%; }
  button.btn-main:active { transform: translateY(0) scale(.98); }

  .counter {
    margin-left: auto;
    color: var(--primary);
    font-size: 12.5px; font-weight: 600;
    padding: 8px 18px;
    background: #fff;
    border-radius: 100px;
    box-shadow: 0 2px 8px rgba(15,42,74,0.08);
  }

  /* ── TABLE ── */
  .table-wrap {
    max-height: 72vh; overflow: auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(15,42,74,0.08);
    overflow: hidden;
  }
  table#dataTable { border-collapse: collapse; width: max-content; min-width: 100%; }
  #dataTable thead th {
    position: sticky; top: 0;
    background: var(--primary);
    color: #fff;
    padding: 11px 12px;
    text-align: left; font-weight: 700;
    white-space: nowrap; z-index: 10;
    font-size: 10.5px; letter-spacing: .5px;
    text-transform: uppercase;
  }
  #dataTable tbody td {
    padding: 9px 12px;
    border-bottom: 1px solid #eef2f7;
    vertical-align: top; font-size: 12px;
    line-height: 1.45; max-width: 380px;
    word-wrap: break-word; white-space: pre-wrap;
    color: var(--text);
  }
  #dataTable tbody tr { transition: background .15s; }
  #dataTable tbody tr:hover td { background: #f7fafd; }
  #dataTable tbody tr.negative td { background: #fff5f5; }
  #dataTable tbody tr.negative:hover td { background: #ffe8e8; }
  #dataTable tbody tr.positive td { background: #f3fcf6; }
  #dataTable tbody tr.positive:hover td { background: #e4f8eb; }
  #dataTable tbody tr.neutral td { background: #fffbef; }
  #dataTable tbody tr.neutral:hover td { background: #fff5da; }

  th.col-date,     td.col-date     { min-width: 95px; }
  th.col-name,     td.col-name     { min-width: 140px; }
  th.col-city,     td.col-city     { min-width: 90px; }
  th.col-loc,      td.col-loc      { min-width: 160px; font-weight: 600; }
  th.col-channel,  td.col-channel  { min-width: 70px; }
  th.col-type,     td.col-type     { min-width: 120px; }
  th.col-cat,      td.col-cat      { min-width: 160px; }
  th.col-status,   td.col-status   { min-width: 130px; }
  th.col-valid,    td.col-valid    { min-width: 130px; }
  th.col-comp,     td.col-comp     { min-width: 130px; }
  th.col-measures, td.col-measures { min-width: 160px; }
  th.col-desc,     td.col-desc     { min-width: 340px; }
  th.col-emp,      td.col-emp      { min-width: 100px; }
  th.col-rating,   td.col-rating   { min-width: 70px; text-align: center; font-weight: 700; }
  th.col-post,     td.col-post     { min-width: 140px; }
  th.col-contact,  td.col-contact  { min-width: 150px; }
  th.col-problem,  td.col-problem  { min-width: 180px; }
  th.col-dec,      td.col-dec      { min-width: 360px; }

  .badge-type {
    display: inline-block; padding: 3px 10px;
    border-radius: 100px; font-size: 10.5px;
    font-weight: 700; text-transform: uppercase;
    letter-spacing: .3px;
  }
  .badge-type.neg { background: #fde8e8; color: #b8332f; }
  .badge-type.pos { background: #e3f6e9; color: #1f7a44; }
  .badge-type.neu { background: #fdf3d9; color: #a67c00; }

  .rating-star { color: var(--gold); font-weight: 800; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #f5f5f5; }
  ::-webkit-scrollbar-thumb {
    background: #c8d0de; border-radius: 10px;
    border: 2px solid #f5f5f5; background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: #a8b4c8; background-clip: padding-box; }

  @media (max-width: 700px) {
    body { padding: 10px; font-size: 11.5px; }
    h1 { font-size: 16px; }
    .stat-value { font-size: 22px; }
    .trend-grid { grid-template-columns: 1fr; }
    .tab { padding: 8px 16px; font-size: 12px; }
    .counter { margin-left: 0; }
  }

.table-wrap{overflow:auto!important}
#dataTable td.col-desc,#dataTable td.col-dec,#dataTable td.col-problem,#dataTable td.col-measures{white-space:pre-wrap!important;word-break:break-word;min-width:440px;max-width:560px;text-overflow:clip!important;overflow:visible!important;max-height:none!important}
#dataTable th.col-desc,#dataTable th.col-dec,#dataTable th.col-problem{min-width:440px}
.ov{z-index:1000!important}
.seg{display:inline-flex;gap:4px;margin:0 0 12px 12px}.seg button,.ib{border:1px solid rgba(15,42,74,.15);background:#fff;border-radius:100px;padding:7px 16px;font:600 12px inherit;font-family:inherit;color:var(--primary);cursor:pointer}.seg button.on{background:var(--primary);color:#fff}
.top{display:flex;align-items:center;flex-wrap:wrap}.top h1{margin:0 0 12px}
.toolbar input,.toolbar select,.mf input,.mf select,.mf textarea{padding:8px 12px;border:1px solid #d5dce6;border-radius:12px;font:12px inherit;font-family:inherit;background:#fff;max-width:100%}
.toolbar input[type=search]{min-width:200px}.ib.del{color:var(--red)}.ib{padding:4px 9px}
#dataTable th{cursor:pointer}#dataTable tbody tr{cursor:pointer}#dataTable tbody tr:hover td{background:#f0f5ff}
.pager{display:flex;gap:10px;align-items:center;justify-content:center;margin:12px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal .h{text-align:center;font-weight:700;color:var(--text-mute);font-size:11px;padding:4px}
.cd{background:#fff;border-radius:12px;min-height:78px;padding:7px 9px;cursor:pointer;box-shadow:0 2px 8px rgba(15,42,74,.06);border:2px solid transparent;font-size:11px}
.cd:hover{border-color:var(--gold)}.cd.sel{border-color:var(--primary)}.cd.out{opacity:.35}.cd.today b{color:var(--gold)}.cd b{font-size:13px}.cd div{margin-top:3px;font-weight:600}
.cd .n{color:var(--red)}.cd .p{color:var(--green)}.cd .u{color:var(--yellow)}
.ov{position:fixed;inset:0;background:rgba(15,42,74,.45);display:none;align-items:center;justify-content:center;z-index:9;padding:12px}.ov.on{display:flex}
.md{background:#fff;border-radius:16px;padding:20px;max-width:760px;width:100%;max-height:92vh;overflow:auto}
.mf{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mf label{font-size:10.5px;font-weight:700;color:var(--text-dim);text-transform:uppercase;display:flex;flex-direction:column;gap:3px}.mf .w{grid-column:1/-1}.mf textarea{min-height:70px}
@media(max-width:600px){.mf{grid-template-columns:1fr}.trend-grid{grid-template-columns:1fr}}

@media(max-width:700px){
html,body{overflow-x:hidden}.container{min-width:0}
.seg{margin:0 0 10px}.top h1{margin:0 0 8px;font-size:15px}
.tabs{display:flex;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;white-space:nowrap}
#statsCards{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}
.trend-card{overflow-x:auto;padding:12px 10px}.trend-card h3{flex-wrap:wrap}.trend-card .note{display:block;margin:2px 0 0;font-size:10px}
.trend-table th,.trend-table td{padding:7px 4px;font-size:11px}
.trend-table th:nth-child(7),.trend-table td:nth-child(7){display:none}
.trend-table td.loc{min-width:76px}
.cal{gap:3px}.cd{min-height:56px;padding:4px;border-radius:8px;font-size:9.5px}.cd b{font-size:11px}
.pager,.toolbar{flex-wrap:wrap}.toolbar input[type=search]{min-width:0;flex:1 1 100%}
#locationsGrid{grid-template-columns:1fr!important}
}
.pctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px;font-size:12px;color:var(--text-mute)}
.pctl .seg{display:flex;gap:4px;padding:4px;background:rgba(15,42,74,.05);border-radius:100px}
.pctl button{border:0;background:transparent;padding:7px 14px;border-radius:100px;font:inherit;font-size:12px;font-weight:700;color:var(--text-mute);cursor:pointer}
.pctl button.on{background:var(--primary);color:#fff}
.pctl select{padding:7px 10px;border:1px solid #e1e6ee;border-radius:10px;font:inherit;font-size:12px;background:#fff;color:var(--primary)}

/* ===== ДИНАМИКА ===== */
const inW=(r,i)=>{const d=iso(r.date),w=D.weeks[i];return !!w&&d>=w[0]&&d<=w[1]};
const MONS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'],MS=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
let PM={mode:'w',gran:'m',item:null,a:null,b:null};
const U=(y,m,d)=>new Date(Date.UTC(y,m,d)),I=d=>d.toISOString().slice(0,10),p2=n=>(n<10?'0':'')+n,dm=d=>p2(d.getUTCDate())+'.'+p2(d.getUTCMonth()+1);
const okIso=s=>/^\d{4}-\d\d-\d\d$/.test(s);
function setPM(k,v){PM[k]=(k==='mode'||k==='gran')?v:+v;if(k==='gran')PM.item=null;renderTrends()}
function buildPeriods(){
 const ds=rows.map(r=>iso(r.date)).filter(okIso).sort(),mx=ds.length?ds[ds.length-1]:I(new Date()),mxD=new Date(mx+'T00:00:00Z');
 const my=mxD.getUTCFullYear(),mm=mxD.getUTCMonth(),mq=Math.floor(mm/3);
 const ys=[...new Set(ds.map(s=>+s.slice(0,4)).concat([my,my-1]))].sort();
 const rng=(y,g,i)=>g==='m'?[U(y,i,1),U(y,i+1,0)]:[U(y,i*3,1),U(y,i*3+3,0)];
 let C=[];
 if(PM.mode==='w'){const W=D.weeks.slice(-4),P=D.periods.slice(-4);C=W.map((w,i)=>({l:P[i],f:w[0],t:w[1],open:i===W.length-1}));}
 else if(PM.mode==='m'){for(let k=5;k>=0;k--){const f=U(my,mm-k,1),e=U(my,mm-k+1,0),cl=e<=mxD;C.push({l:MS[f.getUTCMonth()]+' '+f.getUTCFullYear(),f:I(f),t:I(cl?e:mxD),open:!cl})}}
 else if(PM.mode==='q'){for(let k=3;k>=0;k--){const f=U(my,(mq-k)*3,1),e=U(my,(mq-k)*3+3,0),cl=e<=mxD;C.push({l:(Math.floor(f.getUTCMonth()/3)+1)+' кв. '+f.getUTCFullYear(),f:I(f),t:I(cl?e:mxD),open:!cl})}}
 else{
  const g=PM.gran,item=PM.item==null?(g==='m'?mm:mq):PM.item,A=PM.a==null?my:PM.a,B=PM.b==null?A-1:PM.b;PM.item=item;PM.a=A;PM.b=B;
  const [fa,ea]=rng(A,g,item),[fb,eb]=rng(B,g,item),open=ea>mxD,ta=open?mxD:ea;
  let tb=eb;if(open){const n=Math.round((ta-fa)/864e5);const x=new Date(fb.getTime()+n*864e5);if(x<eb)tb=x}
  const nm=g==='m'?MONS[item]:(item+1)+' квартал';
  C=[{l:nm+' '+B,f:I(fb),t:I(tb),sub:dm(fb)+'–'+dm(tb)},{l:nm+' '+A,f:I(fa),t:I(ta),sub:dm(fa)+'–'+dm(ta),open}];
 }
 return {C,ys,mx};
}
function renderTrends(){
 const {C,ys}=buildPeriods(),N=C.length,L=locNames();
 const warn=[];C.forEach(c=>{if(!rows.some(r=>{const d=iso(r.date);return d>=c.f&&d<=c.t}))warn.push(c.l)});
 const seg=(k,v,t)=>`<button class="${PM[k]===v?'on':''}" onclick="setPM('${k}','${v}')">${t}</button>`;
 const sel=(k,arr,cur)=>`<select onchange="setPM('${k}',this.value)">${arr.map(([v,t])=>`<option value="${v}" ${v==cur?'selected':''}>${t}</option>`).join('')}</select>`;
 let ctl=`<div class="seg">${seg('mode','w','4 недели')}${seg('mode','m','Месяцы')}${seg('mode','q','Кварталы')}${seg('mode','y','Год к году')}</div>`;
 if(PM.mode==='y'){
  const it=PM.gran==='m'?MONS.map((t,i)=>[i,t]):[0,1,2,3].map(i=>[i,(i+1)+' квартал']),yr=ys.map(y=>[y,y]);
  ctl+=`<div class="seg">${seg('gran','m','Месяц')}${seg('gran','q','Квартал')}</div>${sel('item',it,PM.item)}<span>сравнить</span>${sel('a',yr,PM.a)}<span>с</span>${sel('b',yr,PM.b)}`;
 }
 if(warn.length)ctl+=`<div class="warn">⚠ В таблице нет отзывов за: ${warn.join(', ')}</div>`;
 $('periodCtl').innerHTML=ctl;
 const what={w:'неделям',m:'месяцам',q:'кварталам',y:'периодам'}[PM.mode];
 $('pb').textContent=C.map(c=>c.l).join(' · ');
 const cnt=(n,t,c)=>rows.filter(r=>{if(r.loc!==n||r.typeNorm!==t)return false;const d=iso(r.date);return d>=c.f&&d<=c.t}).length;
 const data=L.map(n=>({n,neg:C.map(c=>cnt(n,'Отрицательный',c)),pos:C.map(c=>cnt(n,'Положительный',c))}));
 const sum=k=>C.map((_,i)=>data.reduce((s,x)=>s+x[k][i],0));
 const head=`<thead><tr><th>Точка</th>${C.map(c=>`<th style="text-align:center">${c.l}${c.open&&PM.mode!=='y'?'*':''}${c.sub?'<br><span style="font-weight:500;text-transform:none">'+c.sub+'</span>':''}</th>`).join('')}<th style="text-align:center">Δ</th><th style="text-align:center">%</th><th style="text-align:center">Итог</th></tr></thead>`;
 const go=(loc,type,c)=>`onclick='openReg(${jat({loc,type,from:c.f,to:c.t,label:(loc||'Все точки')+' · '+(type?type.replace(/ый$/,'ые'):'все типы')+' · '+ruD(c.f)+'–'+ruD(c.t)})})'`;
 const row=(l,v,bt,loc,type)=>{const t=evalTrend(v[N-2],v[N-1],bt);return `<tr><td class="loc clk" ${N?go(loc,type,{f:C[0].f,t:C[N-1].t}):''}>${l}</td>${v.map((x,i)=>`<td class="num ${x?'clk':''}" ${x?go(loc,type,C[i]):''}>${x}</td>`).join('')}<td style="text-align:center"><span class="delta ${t.cls}"><span class="arrow">${t.arrow}</span>${t.v}</span></td><td style="text-align:center"><span class="delta ${t.cls}">${t.p}</span></td><td style="text-align:center"><span class="trend-badge ${t.b}">${t.label}</span></td></tr>`};
 const dn=PM.mode==='y'&&N>1?'Δ: '+C[N-1].l+' к '+C[N-2].l+' (за то же число дней)':'Δ: последний период к предыдущему · * период не закрыт';
 $('periodTrends').innerHTML=`<div class="trend-card" style="grid-column:1/-1"><h3>📅 Ключевые метрики по ${what}<span class="note">меньше негатива / больше позитива = лучше · ${dn}</span></h3><table class="trend-table">${head}<tbody>${row('🔴 Отрицательные',sum('neg'),'down','','Отрицательный')}${row('🟢 Положительные',sum('pos'),'up','','Положительный')}</tbody></table></div>`;
 const tb=(k,bt,asc)=>`<table class="trend-table">${head}<tbody>${data.slice().sort((a,b)=>asc*((a[k][N-1]-a[k][N-2])-(b[k][N-1]-b[k][N-2]))).map(x=>row(esc(x.n),x[k],bt,x.n,k==='neg'?'Отрицательный':'Положительный')).join('')}</tbody></table>`;
 $('hotelTrends').innerHTML=`<div class="trend-card"><h3>🔴 Негативные отзывы по точкам<span class="note">меньше = лучше</span></h3>${tb('neg','down',1)}</div><div class="trend-card"><h3>🟢 Положительные отзывы по точкам<span class="note">больше = лучше</span></h3>${tb('pos','up',-1)}</div>`}

const ruD=s=>s.split('-').reverse().join('.');

 m=BP.match(/^m:(\d{4})-(\d\d)$/);if(m){const y=+m[1],o=+m[2]-1;return{f:I(U(y,o,1)),t:I(U(y,o+1,0))}}
 m=BP.match(/^q:(\d{4})-(\d)$/);if(m){const y=+m[1],q=+m[2]-1;return{f:I(U(y,q*3,1)),t:I(U(y,q*3+3,0))}}return null}

 const ms=[...new Set(ds.map(s=>s.slice(0,7)))].reverse(),qs=[...new Set(ds.map(s=>s.slice(0,4)+'-'+(Math.floor((+s.slice(5,7)-1)/3)+1)))].reverse();

function applyFilterP(f,v,l){const g=bdRange();F={field:f,value:v};$('q').value='';$('fs').value='';$('fc').value='';$('fl').value=BL||'';$('ft').value='';$('fa').value=g?g.f:'';$('fb').value=g?g.t:'';

function bd(title,e,color,f){if(!e.length)return'';const mx=Math.max(...e.map(x=>x[1])),T=e.reduce((s,x)=>s+x[1],0);
 return `<div class="breakdown"><h3>${title}</h3><table>${e.map(([k,v])=>`<tr onclick='${f==='loc'?'setBL('+jat(k)+')':'applyFilterP('+jat(f)+','+jat(k)+','+jat(title.replace(/^\S+ /,'').replace(/ \(.*$/,'')+': '+k)+')'}'><td><span class="bar ${color}" style="width:${Math.max(3,Math.round(v/mx*70))}px"></span>${esc(k)}</td><td>${v} <span style="color:var(--text-mute);font-weight:400;font-size:11px">(${Math.round(v/T*100)}%)</span></td></tr>`).join('')}</table></div>`}

function filtered(){let d=vis();const q=$('q').value.trim().toLowerCase();
 if(q)d=d.filter(r=>[r.desc,r.name,r.loc,r.city,r.num,r.cat,r.decision,r.problem].join(' ').toLowerCase().includes(q));
 if($('fl').value)d=d.filter(r=>r.loc===$('fl').value);if($('ft').value)d=d.filter(r=>r.typeNorm===$('ft').value);if($('fs').value)d=d.filter(r=>r.status===$('fs').value);if($('fc').value)d=d.filter(r=>r.close===$('fc').value);
 if($('fa').value)d=d.filter(r=>iso(r.date)>=$('fa').value);if($('fb').value)d=d.filter(r=>iso(r.date)<=$('fb').value);
 if(F.field)d=d.filter(r=>r[F.field]===F.value);
 const k=S.k;return d.slice().sort((a,b)=>{let x=k==='date'?iso(a.date):a[k],y=k==='date'?iso(b.date):b[k];if(k==='rating'){x=+x;y=+y}return(x>y?1:x<y?-1:0)*S.d})}

 $('tbody').innerHTML=d.slice(page*PS,page*PS+PS).map(r=>{const cl=r.typeNorm==='Отрицательный'?'negative':r.typeNorm==='Положительный'?'positive':'neutral';
  return `<tr class="${cl}" onclick="openM('${esc(r.num)}')">`+FIELDS.filter(f=>f[3]).map(f=>{const k=f[0];let v=k==='type'?r.typeNorm:r[k];

   return `<td class="${f[3]}">${v}</td>`}).join('')+'</tr>'}).join('');
 const n=d.filter(r=>r.typeNorm==='Отрицательный').length,p=d.filter(r=>r.typeNorm==='Положительный').length;

function exp(t){const d=filtered().map(r=>Object.fromEntries(ORDER.map(k=>[FM[k][1],r[k]])));const ws=XLSX.utils.json_to_sheet(d),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Реестр');
 if(t==='xlsx')XLSX.writeFile(wb,'Реестр_Мадлен.xlsx');else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+XLSX.utils.sheet_to_csv(ws)],{type:'text/csv;charset=utf-8'}));a.download='Реестр_Мадлен.csv';a.click()}}
const fd=v=>v instanceof Date?[v.getDate(),v.getMonth()+1,v.getFullYear()].map((x,i)=>String(x).padStart(i<2?2:4,'0')).join('.'):String(v||'').trim();
$('imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;e.target.value='';
 try{const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true}),inc=[];
  const sn=wb.SheetNames.filter(n=>/мадлен/i.test(n));(sn.length?sn:wb.SheetNames).forEach(n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:''}).forEach(o=>{if(o['Дата']===undefined||o['Дата']===''||!('Локация' in o))return;const r={};ORDER.forEach(k=>{r[k]=FM[k][1] in o?o[FM[k][1]]:'';if(typeof r[k]==='string')r[k]=r[k].trim()});r.date=fd(r.date);r.loc=ALC[String(r.loc).toLowerCase()]||r.loc;inc.push(r)}));
  const ck=r=>[r.date,String(r.name).trim(),String(r.desc).trim().slice(0,30)].join('|'),byK=new Map(rows.map(r=>[ck(r),r.num]));let nx=Math.max(0,...rows.map(r=>+String(r.num).replace(/\D/g,'')||0));inc.forEach(r=>{if(!r.num){r.num=byK.get(ck(r))||'M-'+String(++nx).padStart(3,'0');byK.set(ck(r),r.num)}});
  const seen=new Set(),err=[],ok=[];let dup=0;
  inc.forEach(r=>{if(seen.has(r.num)){dup++;return}seen.add(r.num);if(!/^\d{2}\.\d{2}\.\d{4}$/.test(r.date)||!r.loc){err.push(r.num);return}ok.push(r)});
  const have=new Set(rows.map(r=>r.num)),upd=ok.filter(r=>have.has(r.num)).length;
  if(!ok.length)return alert('Нет подходящих строк. Нужны колонки «Дата» (дд.мм.гггг) и «Локация».');
  if(!confirm(`Предпросмотр импорта:\nНовых: ${ok.length-upd}\nБудет обновлено по номеру: ${upd}\nДубликатов в файле пропущено: ${dup}\nСтрок с ошибками: ${err.length}${err.length?' ('+err.slice(0,5).join(', ')+')':''}\n\nИмпорт действует до обновления страницы: постоянные данные берутся из таблицы.\n\nПрименить?`))return;
  ok.forEach(r=>{const i=rows.findIndex(x=>x.num===r.num);if(i>=0)rows[i]={...rows[i],...r};else rows.push(r)});prep();save();refresh()}catch(x){alert('Ошибка чтения файла: '+x.message)}};

 if(rows.some(x=>x.num===r.num&&x.num!==editNum))return alert('Отзыв с таким номером уже есть');
 if(editNum){const i=rows.findIndex(x=>x.num===editNum);rows[i]=r}else rows.push(r);prep();save();$('ov').classList.remove('on');refresh()}
function delM(){if(confirm(`Удалить отзыв №${editNum}? Действие необратимо.`)){rows=rows.filter(x=>x.num!==editNum);save();$('ov').classList.remove('on');refresh()}}
function goCal(){const r=rows.find(x=>x.num===editNum),[d,m,y]=r.date.split('.');cal=new Date(+y,m-1,1);calDay=r.date;$('ov').classList.remove('on');showTab(2)}

/* ===== КАЛЕНДАРЬ ===== */
const cm=n=>{cal=new Date(cal.getFullYear(),cal.getMonth()+n,1);renderCal()},ctoday=()=>{const t=new Date();cal=new Date(t.getFullYear(),t.getMonth(),1);calDay=null;renderCal()};
const ds=d=>[d.getDate(),d.getMonth()+1,d.getFullYear()].map((x,i)=>String(x).padStart(i<2?2:4,'0')).join('.');
const calRows=()=>vis().filter(r=>!$('cl').value||r.loc===$('cl').value);
function renderCal(){const R=calRows(),by={};R.forEach(r=>(by[r.date]=by[r.date]||[]).push(r));
 $('ct').textContent=cal.toLocaleDateString('ru',{month:'long',year:'numeric'});
 const off=(cal.getDay()+6)%7,start=new Date(cal.getFullYear(),cal.getMonth(),1-off),today=ds(new Date());
 let h=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="h">${x}</div>`).join('');
 for(let i=0;i<42;i++){const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),k=ds(d),a=by[k]||[],c=t=>a.filter(r=>r.typeNorm===t).length;
  h+=`<div class="cd ${d.getMonth()!==cal.getMonth()?'out':''} ${k===calDay?'sel':''} ${k===today?'today':''}" onclick="calDay='${k}';renderCal()"><b>${d.getDate()}</b>${a.length?`<div>${a.length} отз.</div><div><span class="n">${c('Отрицательный')?'🔴'+c('Отрицательный'):''}</span> <span class="p">${c('Положительный')?'🟢'+c('Положительный'):''}</span> <span class="u">${c('Нейтральный')?'🟡'+c('Нейтральный'):''}</span></div>`:''}</div>`}
 $('cal').innerHTML=h;const a=calDay?by[calDay]||[]:[];$('dt').style.display=$('dl').style.display=calDay?'':'none';
 if(calDay){$('dt').textContent=`📅 ${calDay} — отзывов: ${a.length}`;$('dl').innerHTML=a.length?`<table class="trend-table"><tbody>${a.map(r=>`<tr style="cursor:pointer" onclick="openM('${esc(r.num)}')"><td class="loc">${esc(r.loc)}</td><td><span class="badge-type ${{Отрицательный:'neg',Положительный:'pos'}[r.typeNorm]||'neu'}">${r.typeNorm}</span></td><td>★ ${r.rating}</td><td>${esc(r.status)}</td><td>${esc(r.desc).slice(0,140)}</td></tr>`).join('')}</tbody></table>`:'<div style="padding:16px;color:var(--text-mute)">Нет отзывов за этот день</div>'}}

/* ===== НАВИГАЦИЯ ===== */
function showTab(i){document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('active',j===i));document.querySelectorAll('.panel').forEach((p,j)=>p.classList.toggle('active',j===i));if(i===1)renderRows();if(i===2)renderCal()}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>showTab(+t.dataset.i));
function fillSel(){const o=locNames().map(n=>`<option>${esc(n)}</option>`).join('');$('fl').innerHTML='<option value="">Все точки</option>'+o;$('cl').innerHTML='<option value="">Все точки</option>'+o;$('cl').onchange=renderCal}
function refresh(){renderStats();renderLocations();renderTrends();renderBreakdowns();renderRows();renderCal()}
fillSel();refresh();

/* ===== ЖИВЫЕ ДАННЫЕ ИЗ GOOGLE ТАБЛИЦЫ (лист «Мадлен») ===== */
const SHEET_URL=(function(){try{return parent.SHEET_URL}catch(e){}})()||'https://script.google.com/macros/s/AKfycbwqQMIc01Kl_BcyFziimfWrHDZucwC00_0dTUswHUWKjGgBNleQ_LgVx0ETyT8CTbD5/exec';
(function(){
 const note=document.createElement('div');
 note.style.cssText='font:12px system-ui,sans-serif;color:#64748b;padding:4px 12px;text-align:right';
 document.body.insertBefore(note,document.body.firstChild);
 if(!/^https?:\/\//.test(SHEET_URL)){note.textContent='SHEET_URL не задан — данные не загружены';return}
 note.textContent='Загрузка данных из таблицы…';
 fetch(SHEET_URL+(SHEET_URL.includes('?')?'&':'?')+'part=madlen',{cache:'no-store'}).then(r=>r.json()).then(R=>{
  if(R.error)throw new Error(R.error);
  if(!R.madlen)throw new Error('по этой ссылке (…'+SHEET_URL.slice(-14)+') отвечает старая версия скрипта. Вставьте новый Code.gs и сделайте «Развернуть → Управлять развертываниями → Новая версия»');
  D.rows=R.rows;D.periods=R.periods;D.weeks=R.weeks;
  (function(){/* рейтинги 2ГИС: лист «Мадлен 2GIS» (если есть) → иначе прежние показатели; средняя «Оценка» — только для точек без рейтинга */
   const nm=s=>String(s).toLowerCase().replace(/қ/g,'к').replace(/ё/g,'е').replace(/[^a-zа-я0-9]/g,'');
   const locs={};R.rows.forEach(x=>{const l=ALC[String(x.loc).toLowerCase()]||x.loc;if(l)locs[nm(l)]=l});
   const base=Object.assign({},REF.gis),prev=Object.assign({},REF.gisPrev);
   if(R.gisFromSheet&&R.gisNew)Object.keys(R.gisNew).forEach(k=>{const m=Object.keys(base).find(b=>nm(b)===nm(k))||k;prev[m]=(R.gisPrevNew&&R.gisPrevNew[k])||(typeof base[m]==='number'?base[m]:prev[m]);base[m]=R.gisNew[k]});
   const miss=[];
   Object.keys(locs).forEach(q=>{const l=locs[q],has=Object.keys(base).some(b=>nm(b)===q&&typeof base[b]==='number'&&base[b]>0);if(!has){const a=(R.gisNew||{})[l];if(a){base[l]=a;prev[l]=(R.gisPrevNew||{})[l]||a}else if(!(l in base)||!(base[l]>0))miss.push(l)}});
   D.gis=base;D.gisPrev=prev;window.__noGis=miss.filter(l=>!D.gnote[l]);
  })();
  rows=R.rows;D.rows=rows;try{localStorage.removeItem(KEY)}catch(_){}prep();
  const mx=rows.map(r=>iso(r.date)).filter(okIso).sort().pop();if(mx)cal=new Date(+mx.slice(0,4),+mx.slice(5,7)-1,1);
  fillSel();refresh();
  note.textContent='Данные из таблицы · обновлено '+R.updated+' · отзывов: '+rows.length+(R.stats?' · '+R.stats.map(x=>x.sheet+': в листе '+x.inSheet+', выгружено '+x.loaded).join('; '):'');
 }).catch(e=>{rows=[];D.rows=[];try{prep();fillSel();refresh()}catch(_){}note.textContent='Не удалось загрузить таблицу ('+e.message+'). Обновите страницу.';note.style.color='#dc2626'});
})();
</script></body></html>
